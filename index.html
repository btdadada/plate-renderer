<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>plate-generator</title>
    <style>
      .selector {
        margin-bottom: 10px;
      }
      .selector input,
      .selector select {
        padding: 10px;
      }
      #app {
        width: 170px;
      }
    </style>
  </head>
  <body>
    <div class="selector">
      <input type="text" placeholder="车牌号" id="input">
      <select id="select">
        <option value="blue">蓝牌</option>
        <option value="green">绿牌</option>
        <option value="greenLarge">绿牌大型车</option>
        <option value="yellow">黄牌大型车/教练车</option>
        <option value="yellowLarge">黄牌大型车后号牌/挂车</option>
        <option value="HK/Macao">港澳车牌</option>
        <option value="shi">大使馆车牌</option>
        <option value="ling">领事馆车牌</option>
        <option value="police">警车车牌</option>
      </select>
    </div>
    <div id="app"></div>
    <div id="app2"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
